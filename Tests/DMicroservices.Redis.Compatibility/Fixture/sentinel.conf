port 26379
bind 0.0.0.0
protected-mode no
requirepass compat-sentinel
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor compat-master master 6379 1
sentinel auth-pass compat-master compat-redis
sentinel down-after-milliseconds compat-master 3000
sentinel failover-timeout compat-master 30000
sentinel parallel-syncs compat-master 1
